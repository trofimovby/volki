<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Найти свою территорию</title>
    <link rel="stylesheet" href="../css/sections/find-territory-section.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <section class="find-territory-section">
        <!-- Верхний блок с фоном и текстом -->
        <div class="find-territory-hero">
            <div class="hero-content">
                <h2 class="hero-title">Найти свою территорию</h2>
                <p class="hero-description">
                    Каждая наша территория имеет свой характер. Доверьтесь нашим экспертам: мы подберем локацию,
                </p>
                <button class="hero-button">
                    <span class="button-text"> НАЙТИ СВОЕ ВРЕМЯ</span>
                    <svg class="button-icon" width="19" height="16" viewBox="0 0 19 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="11.1111" cy="8" r="7.11111" stroke="white"/>
                        <circle cx="2.75" cy="8" r="1.5" stroke="white"/>
                    </svg>
                </button>
            </div>
            <svg class="hero-wave" viewBox="0 0 1300 82" fill="none" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
                <path d="M0 0L1300 0L1300 81.576L0 81.576L0 0Z" fill="#fbfaf1"/>
            </svg>
        </div>

        <!-- Нижний блок с городами -->
        <div class="find-territory-cities">
            <div class="cities-header">
                <h3 class="cities-title">Новые локации Скоро в Бресте и Гродно </h3>
                <div class="cities-line"></div>
            </div>

            <div class="cities-list">
                <!-- Юхновка -->
                <div class="city-item active">
                    <div class="city-icon">
                        <div class="icon-circle">
                            <div class="icon-dot"></div>
                        </div>
                    </div>
                    <div class="city-name">ЮХНОВКА</div>
                </div>

                <!-- Жуковка -->
                <div class="city-item active">
                    <div class="city-icon">
                        <div class="icon-circle">
                            <div class="icon-dot"></div>
                        </div>
                    </div>
                    <div class="city-name">ЖУКОВКА</div>
                </div>

                <!-- Брест -->
                <div class="city-item upcoming">
                    <div class="city-icon">
                        <div class="icon-circle">
                            <div class="icon-dot empty"></div>
                        </div>
                    </div>
                    <div class="city-name">БРЕСТ</div>
                </div>

                <!-- Гродно -->
                <div class="city-item upcoming">
                    <div class="city-icon">
                        <div class="icon-circle">
                            <div class="icon-dot empty"></div>
                        </div>
                    </div>
                    <div class="city-name">ГРОДНО</div>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
